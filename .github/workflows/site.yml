name: Collect news and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'   # новости каждые 30 минут
    - cron: '23 3 * * 1'     # раз в неделю — полная история линии фронта
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh front line timeline
        if: github.event.schedule == '23 3 * * 1' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python3 tools/build_timeline.py --api --out web/data/timeline.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/timeline.json
          git diff --cached --quiet || (git commit -m "Refresh front line timeline" && git push)
      - name: Collect news and current front line
        run: python3 tools/build_news.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
